spring.application.name=relay
server.port=${PORT:8080}

# Database
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/knowledge_assistant}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT
jwt.secret=${JWT_SECRET:knowledge-assistant-super-secret-jwt-signing-key-for-dev-only}
jwt.expiration=${JWT_EXPIRATION:86400000}

# App
frontend.url=${FRONTEND_URL:http://localhost:5174}

# Slack
slack.client.id=${SLACK_CLIENT_ID:}
slack.client.secret=${SLACK_CLIENT_SECRET:}
slack.signing.secret=${SLACK_SIGNING_SECRET:}
