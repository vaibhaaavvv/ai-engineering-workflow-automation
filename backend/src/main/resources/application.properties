spring.application.name=relay
server.port=${PORT:8080}

# Database
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/knowledge_assistant}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# SSL (required for Neon and other cloud PostgreSQL providers)
# spring.datasource.hikari.data-source-properties.sslmode=require

# JWT
jwt.secret=${JWT_SECRET:knowledge-assistant-super-secret-jwt-signing-key-for-dev-only}
jwt.expiration=${JWT_EXPIRATION:86400000}

# App
frontend.url=${FRONTEND_URL:http://localhost:5174}
